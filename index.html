<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185fa5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="决策蒸馏">
<meta name="description" content="把「我是怎么想的」变成可检验的系统：记录、复盘、蒸馏原则、校准训练。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>决策蒸馏 · Decision Distiller v4.0</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e3e5e8;
  --t1:#1f2329; --t2:#5f6470; --t3:#8a909c;
  --blue:#185fa5; --blue-l:#e6f1fb;
  --green:#0f6e56; --green-l:#e1f5ee;
  --red:#a32d2d; --red-l:#fcebeb;
  --purple:#534ab7; --purple-l:#eeedfe;
  --amber:#854f0b; --amber-l:#faeeda;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:14px;line-height:1.65}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px 0;position:sticky;top:0;z-index:50}
.hrow{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
h1 img{width:22px;height:22px;border-radius:6px}
.sub{color:var(--t2);font-size:12px}
nav{max-width:980px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:none;background:none;padding:9px 15px;font-size:13.5px;color:var(--t2);
  cursor:pointer;border-radius:8px 8px 0 0;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle}
main{max-width:980px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
h2{font-size:15.5px;font-weight:700;margin-bottom:10px}
h3{font-size:14px;font-weight:600;margin-bottom:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.muted{color:var(--t2);font-size:12.5px}
.tiny{color:var(--t3);font-size:11.5px}
.why{background:var(--purple-l);color:var(--purple);border-radius:8px;padding:8px 12px;font-size:12px;margin:10px 0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--t2);margin:12px 0 5px}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;
  font-family:inherit;background:#fff;color:var(--t1)}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
button.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;
  background:var(--blue);color:#fff;font-weight:600}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:var(--card);color:var(--t2);border:1px solid var(--line);font-weight:500}
button.btn.sm{padding:5px 11px;font-size:12.5px}
button.btn.warn{background:var(--red)}
button.btn.ok{background:var(--green)}
button.btn.install{background:var(--green-l);color:var(--green);font-size:12px;padding:5px 12px}
button:disabled{opacity:.5;cursor:not-allowed}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input{flex:1}
.slider-val{min-width:44px;text-align:center;font-weight:700;color:var(--blue)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag.blue{background:var(--blue-l);color:var(--blue)}
.tag.green{background:var(--green-l);color:var(--green)}
.tag.red{background:var(--red-l);color:var(--red)}
.tag.amber{background:var(--amber-l);color:var(--amber)}
.tag.purple{background:var(--purple-l);color:var(--purple)}
.tag.gray{background:#eef0f2;color:var(--t2)}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.alert.red{background:var(--red-l);border:1px solid #f1c9c9}
.alert.amber{background:var(--amber-l);border:1px solid #efd9b0}
.alert.blue{background:var(--blue-l);border:1px solid #c9dff2}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat .num{font-size:23px;font-weight:800;color:var(--blue)}
.stat .lbl{font-size:12px;color:var(--t2)}
.list-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;background:#fff}
.list-item:hover{border-color:var(--blue)}
.mode-card{border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;transition:.15s}
.mode-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(24,95,165,.08)}
.mode-card .ico{font-size:24px}
.mode-card h3{margin:6px 0 4px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--blue);transition:.3s}
.steps-nav{display:flex;justify-content:space-between;margin-top:18px}
.chat-box{height:52vh;min-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
  padding:14px;background:#fafbfc;margin-bottom:10px}
.msg{max-width:82%;margin-bottom:10px;padding:9px 13px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.ai{background:var(--blue-l);color:var(--t1);border-bottom-left-radius:3px}
.msg.me{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.chat-input{display:flex;gap:8px}
.chat-input textarea{min-height:44px;max-height:120px}
.modal-mask{position:fixed;inset:0;background:rgba(20,25,35,.45);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:22px;position:relative}
.modal .close{position:absolute;top:12px;right:14px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--t3)}
.bar-wrap{margin-bottom:8px}
.bar-line{display:flex;align-items:center;gap:8px;font-size:12px}
.bar{flex:1;background:var(--line);border-radius:4px;height:14px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.fc-card{min-height:180px;border-radius:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:26px;cursor:pointer;background:#fff}
.fc-card .big{font-size:16px;font-weight:700;line-height:1.7}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.checks label{display:flex;align-items:center;gap:5px;margin:0;font-weight:400;font-size:12.5px;
  border:1px solid var(--line);border-radius:20px;padding:4px 11px;cursor:pointer}
.checks label.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.radio-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.radio-row label{display:flex;align-items:center;gap:5px;margin:0;font-weight:500;cursor:pointer}
.opt-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:#fbfcfd}
.opt-row .del{float:right;border:none;background:none;color:var(--t3);cursor:pointer;font-size:15px}
.pf-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pf-row:last-of-type{border-bottom:none}
.pf-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;
  cursor:pointer;color:var(--t2);white-space:nowrap}
.pf-btn.ok{background:var(--green-l);border-color:var(--green);color:var(--green);font-weight:700}
.pf-btn.no{background:#fcebeb;border-color:var(--red);color:var(--red);font-weight:700}
.pf-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:2px;
  background:#f2f4f6;color:var(--t2)}
.pf-badge.good{background:var(--green-l);color:var(--green)}
.pf-badge.warn{background:#fff6e5;color:#c07800}
.pf-badge.bad{background:#fcebeb;color:var(--red)}
.pf-badge.none{background:#f2f4f6;color:var(--t3)}
.metric{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fbfcfd;
  display:flex;flex-direction:column}
.m-h{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;
  color:var(--t1);border-bottom:1px dashed var(--line);padding-bottom:7px;margin-bottom:8px}
.m-h span{font-size:10.5px;font-weight:400;color:var(--t3)}
.m-v{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.m-n{font-size:11.5px;color:var(--t2);margin-top:2px}
.m-t{font-size:11.5px;color:var(--t3);margin-top:7px;flex:1;line-height:1.5}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv .k{color:var(--t3);font-size:12px}
.domain-row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:13px}
.domain-row:last-child{border-bottom:none}
.footer-note{text-align:center;color:var(--t3);font-size:11.5px;padding:16px 0 0}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(16px);
  background:#1f2329;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;
  pointer-events:none;transition:.25s;z-index:300;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fab{position:fixed;right:20px;bottom:calc(88px + var(--safe-b));width:56px;height:56px;border-radius:50%;
  border:none;background:var(--blue);color:#fff;font-size:22px;cursor:pointer;z-index:90;
  box-shadow:0 4px 14px rgba(24,95,165,.35);display:flex;align-items:center;justify-content:center}
#fab:active{transform:scale(.94)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 7px;font-size:11.5px;background:#fff;color:var(--t2);font-family:monospace}
.search-wrap{position:relative}
.search-wrap input{padding-left:32px}
.search-wrap:before{content:'⌕';position:absolute;left:10px;top:7px;color:var(--t3);font-size:16px}
@media(max-width:600px){
  .kv{grid-template-columns:88px 1fr}
  main{padding:14px 10px 150px}
  header{position:static}
  header nav{position:fixed;bottom:0;left:0;right:0;max-width:none;background:#fff;
    border-top:1px solid var(--line);z-index:60;padding:4px 2px calc(4px + var(--safe-b))}
  header nav button{flex:1;text-align:center;padding:8px 2px;font-size:11.5px;border-radius:8px;border-bottom:none}
  header nav button.active{background:var(--blue-l)}
  #fab{bottom:calc(66px + var(--safe-b))}
  .sub{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div style="display:flex;align-items:baseline;gap:12px">
      <h1><img src="icon.svg" alt="" onerror="this.style.display='none'">决策蒸馏</h1>
      <span class="sub">Decision Distiller v4.0 · 把"我是怎么想的"变成可检验的系统</span>
    </div>
    <button class="btn install" id="install-btn" style="display:none" onclick="installApp()">📲 安装App</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<button id="fab" onclick="fabQuick()" title="快速记录 (快捷键 N)">⚡</button>
<div id="modal-root"></div>

<script>
/* ================= 数据层 ================= */
var LS_KEY = 'dd_data_v1';
var S = load();
function defaults(){
  return { v:2, decisions:[], principles:[], replays:[], fcStats:{},
    settings:{aiEndpoint:'',aiKey:'',aiModel:''},
    assess:null, assessHist:[], forecasts:[], sjt:[],
    usage:{quick:0,quickDone:0,guided:0,ai:0,reviews:0,replays:0,fcEasy:0,fcHard:0,forecasts:0,sjt:0,assess:0,arc:0,seed:0},
    lastExport:null, lastBackup:null, bkName:'' };
}
/* 旧版本数据（含外部导入的备份）补齐缺失字段，避免新功能读到 undefined */
function migrate(d){
  var def=defaults();
  if(!d || !d.decisions) return def;
  for(var k in def){ if(d[k]==null) d[k]=def[k]; }
  for(var ku in def.usage){ if(d.usage[ku]==null) d.usage[ku]=def.usage[ku]; }
  for(var ks in def.settings){ if(d.settings[ks]==null) d.settings[ks]=def.settings[ks]; }
  if(!d.assessHist) d.assessHist=[];
  return d;
}
function load(){
  try{
    var d = JSON.parse(localStorage.getItem(LS_KEY));
    if(d && d.decisions) return migrate(d);
  }catch(e){}
  return defaults();
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  idbMirror();
  scheduleAutoBackup();
}
/* 导出/备份统一走这里：剥离 API Key 与内部字段 */
function stripKey(d){
  var c=JSON.parse(JSON.stringify(d));
  if(c.settings) c.settings.aiKey='';
  delete c._bkThrottle;
  return c;
}

/* ---------- IndexedDB 镜像：localStorage 被清/损坏时的第二份活拷贝 ---------- */
function idbOpen(){
  try{
    if(!window.indexedDB) return null;
    var rq=window.indexedDB.open('dd_store',1);
    rq.onupgradeneeded=function(e){ e.target.result.createObjectStore('kv'); };
    return rq;
  }catch(e){ return null; }
}
function idbMirror(){
  try{
    var rq=idbOpen(); if(!rq) return;
    rq.onsuccess=function(e){ var db=e.target.result;
      try{ db.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(S),'main'); }catch(_){} };
  }catch(e){}
}
/* 启动时若 localStorage 空、镜像有数据 → 自动找回 */
function idbRescue(){
  try{
    var rq=idbOpen(); if(!rq) return;
    rq.onsuccess=function(e){ var db=e.target.result;
      try{
        db.transaction('kv','readonly').objectStore('kv').get('main').onsuccess=function(ev){
          var t=ev.target.result; if(!t) return;
          var d; try{ d=JSON.parse(t); }catch(_){ return; }
          if(d && d.decisions && d.decisions.length && (!S.decisions || !S.decisions.length)){
            S=migrate(d); save(); render();
            toast('♻️ 已从备用存储找回 '+S.decisions.length+' 条记录（浏览器清过主存储）');
          }
        };
      }catch(_){} };
  }catch(e){}
}
function idbClear(){
  try{
    var rq=idbOpen(); if(!rq) return;
    rq.onsuccess=function(e){ var db=e.target.result;
      try{ db.transaction('kv','readwrite').objectStore('kv').clear(); }catch(_){} };
  }catch(e){}
}

/* ---------- 文件自动备份（File System Access，Chrome/Edge 桌面） ----------
   一次性选好备份文件后，句柄存进 IndexedDB，之后写入不再需要用户操作 */
function setupAutoBackup(){
  if(!(window.showSaveFilePicker)){ toast('当前浏览器不支持自动备份文件（需 Chrome/Edge 桌面版）。请每 30 天手动导出 JSON。',4200); return; }
  window.showSaveFilePicker({suggestedName:'决策蒸馏-自动备份.json',
    types:[{description:'JSON 备份',accept:{'application/json':['.json']}}]})
  .then(function(h){
    return h.createWritable().then(function(w){
      return w.write(JSON.stringify(stripKey(S))).then(function(){ return w.close(); });
    }).then(function(){ return h; });
  })
  .then(function(h){
    try{
      var rq=idbOpen();
      if(rq) rq.onsuccess=function(e){ var db=e.target.result;
        try{ db.transaction('kv','readwrite').objectStore('kv').put(h,'backupHandle'); }catch(_){} };
    }catch(_){}
    S.bkName=h.name; S.lastBackup=Date.now(); save();
    toast('✅ 自动备份已连接：'+h.name+'（此后自动写入，不需要再点）');
  })
  .catch(function(){ /* 用户取消 */ });
}
function autoBackupNow(){
  try{
    var rq=idbOpen(); if(!rq){ return; }
    rq.onsuccess=function(e){ var db=e.target.result;
      try{
        db.transaction('kv','readonly').objectStore('kv').get('backupHandle').onsuccess=function(ev){
          var h=ev.target.result; if(!h){ return; }
          h.createWritable().then(function(w){
            return w.write(JSON.stringify(stripKey(S))).then(function(){ return w.close(); });
          }).then(function(){
            S.lastBackup=Date.now(); localStorage.setItem(LS_KEY, JSON.stringify(S));
            toast('💾 已写入备份文件 '+h.name);
          }).catch(function(){});
        };
      }catch(_){} };
  }catch(e){}
}
var _bkLast=0;
function scheduleAutoBackup(){
  if(Date.now()-_bkLast<600000) return;   /* 至多每 10 分钟写一次盘 */
  _bkLast=Date.now();
  setTimeout(autoBackupNow, 2000);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function daysSince(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function fmtDate(iso){ var d=new Date(iso); return d.getMonth()+1+'月'+d.getDate()+'日'; }
function fmtFull(iso){ var d=new Date(iso); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
var DOMAINS=['职业发展','投资理财','人际关系','健康生活','消费购买','学习成长','其他'];
var BIASES=['结果偏差（以结果论好坏）','确认偏误（只找支持自己的证据）','过度自信','损失厌恶','锚定效应','沉没成本','现状偏差','社会认同（随大流）','即时满足偏好','事后诸葛亮','情绪推理','框架效应'];
var EMO_PRE=['焦虑','兴奋','恐惧','愤怒','平静','犹豫','压力','期待','疲惫','羞愧','内疚','好奇'];

/* ================= 反馈组件（toast / 确认框） ================= */
function toast(msg,ms){
  var t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.className='show';
  clearTimeout(t._t); t._t=setTimeout(function(){ t.className=''; }, ms||2600);
}
var _cb=null;
function confirmBox(msg,onOk){
  _cb=onOk;
  document.getElementById('modal-root').innerHTML=
    '<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:400px;padding:20px">'
    +'<h2>确认</h2><p style="margin:6px 0 18px;font-size:13.5px">'+esc(msg)+'</p>'
    +'<div style="display:flex;gap:10px"><button class="btn warn" style="flex:1" onclick="_cbOk()">确认</button>'
    +'<button class="btn ghost" style="flex:1" onclick="closeModal()">取消</button></div></div></div>';
}
function _cbOk(){ var f=_cb; _cb=null; closeModal(); if(f)f(); }

/* ================= 路由 ================= */
var TABS=[['home','首页'],['capture','记录'],['library','决策库'],['principles','原则库'],['training','训练场'],['settings','设置']];
var tab='home';
function go(t){ tab=t; render(); window.scrollTo(0,0); }
function renderNav(){
  var due=dueReviews().length, drafts=S.decisions.filter(function(d){return d.status==='draft'}).length;
  document.getElementById('nav').innerHTML = TABS.map(function(t){
    var dot=(t[0]==='home'&&(due+drafts)>0)?'<span class="dot"></span>':'';
    return '<button class="'+(tab===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+dot+'</button>';
  }).join('');
}
function render(){ renderNav(); var v=document.getElementById('view');
  if(tab==='home') v.innerHTML=viewHome();
  else if(tab==='capture') v.innerHTML=viewCapture();
  else if(tab==='library') v.innerHTML=viewLibrary();
  else if(tab==='principles') v.innerHTML=viewPrinciples();

/* ================= 决策时原则推送（可信度加权的落地） =================
   匹配 = 文本相似度（中文字符二元组，剥离标点）+ 领域命中 + 证据链加成。
   IF 条件是触发器，权重最高；至少 2 个二元组命中才算 lexical 命中（防"如果/一个"这类通用词单杀）。 */
function bigrams(s){ s=String(s||'').replace(/[^一-龥a-zA-Z0-9]/g,''); var o={};
  for(var i=0;i<s.length-1;i++){ o[s.substr(i,2)]=1; } return o; }
function simHits(a,b){
  var A=bigrams(a),B=bigrams(b);
  var hit=0,nA=0,nB=0;
  for(var k in A){ nA++; if(B[k]) hit++; }
  for(var kb in B){ nB++; }
  return {hit:hit,nA:nA||1,nB:nB||1};
}
function simScore(a,b){ var h=simHits(a,b); return h.hit? h.hit/h.nA : 0; }
function matchPrinciples(text,domain,cut,n){
  if(!S.principles.length) return [];
  var t=String(text||'').replace(/[^一-龥a-zA-Z0-9]/g,'');
  var list=S.principles.map(function(p){
    var st=pStats(p);
    var hi=simHits(t,p.ifText), ht=simHits(t,p.thenText);
    var sc=(t.length>=6?
        (hi.hit>=2? (hi.hit/hi.nA)*2.5 : 0) + (ht.hit>=2? (ht.hit/ht.nA) : 0)
      : 0)
      +((domain&&p.domain===domain)?0.6:0)
      +0.12*Math.min(st.total,3);
    return {p:p,st:st,sc:sc};
  }).sort(function(a,b){return b.sc-a.sc});
  return list.filter(function(x){return x.sc>=cut}).slice(0,n||3);
}
function pmBoxHtml(text,domain){
  var list=matchPrinciples(text,domain,text&&String(text).replace(/[^一-龥a-zA-Z0-9]/g,'').length>=6?0.32:0.58,3);
  var ds=(domain&&domainStats()[domain])||null;
  var calLine=(ds&&ds.pN)?('该领域过程分 <b style="color:'
    +(ds.pSum/ds.pN>=7?'var(--green)':ds.pSum/ds.pN>=5?'var(--amber)':'var(--red)')+'">'
    +(ds.pSum/ds.pN).toFixed(1)+'</b>/10 — '+(ds.pSum/ds.pN>=7?'直觉可用区':'直觉不可信区，先慢想')+'（'+ds.pN+' 次复盘）'):'';
  if(!list.length&&!calLine) return '';
  var h='<div class="opt-row" style="background:var(--purple-l);border-color:#ddd0f0;margin-top:10px">'
    +'<b style="font-size:12.5px;color:var(--purple)">📜 决策时推送 · 匹配的原则'
    +(calLine?' <span class="tiny" style="color:var(--t3);font-weight:400">· '+calLine+'</span>':'')+'</b>';
  list.forEach(function(x){
    var pct=x.st.total?Math.round(x.st.rate*100):null;
    h+='<div style="margin-top:8px;font-size:12.5px;line-height:1.6">'
      +'<b style="color:var(--purple)">IF</b> '+esc(trunc(x.p.ifText,64))

      +(x.p.source==='seed'?'<span class="pf-badge none">🌱种子</span>':'')+'</div>';
  });
  return h+'</div>';
}

    state:{mood:3,stress:3,sleep:3,energy:3},domain:'',dtype:'decision',prediction:'',
    options:[{name:'',expected:'',prob:''},{name:'',expected:'',prob:''}],chosen:'',
    intuition:'',analysis:'',confidence:70,falsifier:'',reviewInDays:30};
  capMode='guided';
}
function viewWizard(){
  var w=wiz, pct=(w.step/5)*100;
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    +'<h2 style="margin:0">🧭 引导记录 · 第 '+w.step+'/5 步：'+WSTEPS[w.step-1]+'</h2>'
    +'<button class="btn ghost sm" onclick="capMode=null;render()">退出</button></div>'
    +'<div class="progress"><i style="width:'+pct+'%"></i></div>';
  if(w.step===1){
    h+='<label>你现在面对什么事情？打算怎么处理？</label>'
      +'<textarea id="w-sit" style="min-height:120px" oninput="wiz.situation=this.value;onWizPM()">'+esc(w.situation)+'</textarea>'
      +'<div id="w-pm">'+pmBoxHtml(w.situation,w.domain)+'</div>'
      +'<div class="why">💡 为什么自由倾倒优先：先叙述再分析，防止过早框定问题（问题建构方式往往决定答案）。</div>';
  } else if(w.step===2){
    h+='<label>此刻的情绪（点选或自填，带强度 0-10）</label><div class="checks">'
      +EMO_PRE.map(function(e){ var on=w.emotions.some(function(x){return x.name===e});
        return '<label class="'+(on?'on':'')+'" onclick="toggleEmo(\''+e+'\')">'+(on?'✓ ':'')+e+'</label>';}).join('')
      +'</div>'
      +'<div style="margin-top:10px" id="emo-list">'+emoListHtml()+'</div>'
      +'<div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="emo-new" placeholder="自填情绪词，如「释然」">'
      +'<button class="btn ghost sm" onclick="addEmo()">添加</button></div>'
      +'<label>身体有什么感觉？（胸口发紧 / 胃里翻腾 / 肩膀发沉……可留空）</label>'
      +'<textarea id="w-body" style="min-height:50px" oninput="wiz.body=this.value">'+esc(w.body)+'</textarea>'
      +'<label>状态自评（1=很差，5=很好）</label>'
      +stateSlider('mood','心情',w.state.mood)+stateSlider('stress','压力',w.state.stress)
      +stateSlider('sleep','睡眠',w.state.sleep)+stateSlider('energy','精力',w.state.energy)
      +'<div class="why">💡 情绪标注（affect labeling）：给情绪命名能降低杏仁核激活、恢复前额叶调控（Lieberman et al., 2007）。'
      +'说不清感受 ≠ 没有感受——被无视的情绪会改道影响你的判断。</div>';
  } else if(w.step===3){
    h+='<label>这是"决策"还是"预测/判断"？</label><div class="radio-row">'
      +'<label><input type="radio" name="dtype" '+(w.dtype==='decision'?'checked':'')+' onchange="wiz.dtype=this.value" value="decision">决策（要在选项里挑一个）</label>'
      +'<label><input type="radio" name="dtype" '+(w.dtype==='prediction'?'checked':'')+' onchange="wiz.dtype=this.value" value="prediction">预测（判断某事会不会发生）</label></div>'
      +'<label>属于哪个领域？</label><select onchange="wiz.domain=this.value;onWizPM()">'
      +'<option value="">请选择</option>'+DOMAINS.map(function(d){return '<option '+(w.domain===d?'selected':'')+'>'+d+'</option>'}).join('')+'</select>'
      +'<label>补充关键细节：涉及谁？时间窗口？硬约束是什么？最坏会怎样？</label>'
      +'<textarea id="w-detail" style="min-height:90px" oninput="wiz.detail=this.value">'+esc(w.detail||'')+'</textarea>'
      +'<div class="why">💡 预测类条目出结果快、样本量大，是校准训练的最佳燃料——别只记重大决策。</div>';
  } else if(w.step===4){
    h+='<div class="why">💡 第一反应 vs 慢分析双轨记录：积累几十条后，数据会告诉你自己在哪类问题上直觉可信。</div>';
    if(w.dtype==='prediction'){
      h+='<label>你的预测是什么？</label>'
        +'<textarea id="w-pred" style="min-height:60px" oninput="wiz.prediction=this.value">'+esc(w.prediction)+'</textarea>'
        +'<label>你判断它发生的概率（%）</label><div class="slider-row">'
        +'<input type="range" min="5" max="95" value="'+w.confidence+'" oninput="wiz.confidence=+this.value;document.getElementById(\'w-conf-v\').textContent=this.value+\'%\'">'
        +'<span class="slider-val" id="w-conf-v">'+w.confidence+'%</span></div>';
    } else {
      h+='<label>备选方案（至少 2 个。每个写清：选项名 / 预期结果 / 主观概率%）</label><div id="opt-wrap">'+optsHtml()+'</div>'
        +'<button class="btn ghost sm" onclick="wiz.options.push({name:\'\',expected:\'\',prob:\'\'});render()">+ 添加选项</button>'
        +'<label>你倾向于选哪个？</label><select onchange="wiz.chosen=this.value">'
        +'<option value="">未定</option>'+w.options.map(function(o,i){return '<option value="'+i+'" '+(w.chosen==String(i)?'selected':'')+'>'+esc(o.name||('选项'+(i+1)))+'</option>'}).join('')+'</select>'
        +'<label>整体置信度：你觉得自己的判断有多大把握是对的？（%）</label><div class="slider-row">'
        +'<input type="range" min="5" max="95" value="'+w.confidence+'" oninput="wiz.confidence=+this.value;document.getElementById(\'w-conf-v\').textContent=this.value+\'%\'">'
        +'<span class="slider-val" id="w-conf-v">'+w.confidence+'%</span></div>';
    }
    h+='<label>10 秒内的直觉答案（先别想，写出第一反应）</label>'
      +'<textarea id="w-intu" style="min-height:50px" oninput="wiz.intuition=this.value">'+esc(w.intuition)+'</textarea>'
      +'<label>慢分析的结论（权衡了什么？）</label>'
      +'<textarea id="w-ana" style="min-height:70px" oninput="wiz.analysis=this.value">'+esc(w.analysis)+'</textarea>'
      +'<label>🔴 可证伪承诺（必填）：什么证据出现，说明我错了？</label>'
      +'<textarea id="w-fals" style="min-height:60px" oninput="wiz.falsifier=this.value" placeholder="例如：如果三个月内新部门没有给我任何资源承诺，说明我对这次机会的判断过于乐观">'+esc(w.falsifier)+'</textarea>'
      +'<div class="why">💡 可证伪承诺是整个系统不被"事后合理化"污染的闸门——现在不写，复盘时你会给自己找一万条理由。</div>';
  } else {
    h+='<h3>确认这份记录</h3><div class="kv">'
      +'<span class="k">类型</span><span>'+(w.dtype==='prediction'?'预测/判断':'决策')+'</span>'
      +'<span class="k">领域</span><span>'+esc(w.domain)+'</span>'
      +'<span class="k">情境</span><span>'+esc(trunc(w.situation,100))+'</span>'
      +'<span class="k">情绪</span><span>'+(w.emotions.map(function(e){return e.name+'('+e.intensity+')'}).join('、')||'未记录')+'</span>'
      +'<span class="k">'+(w.dtype==='prediction'?'预测':'倾向')+'</span><span>'+esc(w.dtype==='prediction'?w.prediction:(w.options[w.chosen]||{}).name||'未定')+'</span>'
      +'<span class="k">置信度</span><span>'+w.confidence+'%</span>'
      +'<span class="k">可证伪</span><span>'+esc(trunc(w.falsifier,80))+'</span>'
      +'</div>'
      +'<label>多久后提醒你复盘？</label><select onchange="wiz.reviewInDays=+this.value">'
      +[3,7,14,30,90,180,365].map(function(n){return '<option value="'+n+'" '+(w.reviewInDays===n?'selected':'')+'>'+n+' 天后</option>'}).join('')+'</select>'
      +'<div class="why">💡 保存后，事前部分（情境/预期/置信度/可证伪承诺）将锁定不可修改——这不是缺陷，是设计。'
      +'防止未来的你篡改证据。</div>'
      +'<button class="btn ok" style="margin-top:14px;width:100%" onclick="saveWizard()">🔒 锁定并保存</button>';
  }
  h+='<div class="steps-nav"><button class="btn ghost" onclick="wiz.step--;render()">← 上一步</button>'
    +(w.step<5?'<button class="btn" onclick="wizNext()">下一步 →</button>':'<span></span>')+'</div>';
  return h+'</div>';
}
function stateSlider(k,label,v){
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><span style="width:36px;font-size:12.5px;color:var(--t2)">'+label+'</span>'
    +'<input type="range" min="1" max="5" value="'+v+'" style="flex:1" oninput="wiz.state.'+k+'=+this.value"> '
    +'<span class="tiny" style="width:70px;text-align:right">'+['','很差','较差','一般','较好','很好'][v]+'</span></div>';
}
function emoListHtml(){
  return wiz.emotions.map(function(e,i){
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px"><b style="width:56px;font-size:13px">'+esc(e.name)+'</b>'
      +'<input type="range" min="0" max="10" value="'+e.intensity+'" style="flex:1" oninput="wiz.emotions['+i+'].intensity=+this.value;document.getElementById(\'ev-'+i+'\').textContent=this.value">'
      +'<span style="width:24px;font-weight:700;color:var(--purple)" id="ev-'+i+'">'+e.intensity+'</span>'
      +'<button class="btn ghost sm" onclick="wiz.emotions.splice('+i+',1);render()">✕</button></div>';}).join('');
}
function toggleEmo(name){
  var i=wiz.emotions.findIndex(function(x){return x.name===name});
  if(i>=0) wiz.emotions.splice(i,1); else wiz.emotions.push({name:name,intensity:5});
  render();
}
function addEmo(){
  var el=document.getElementById('emo-new'); var v=el.value.trim(); if(!v) return;
  wiz.emotions.push({name:v,intensity:5}); render();
}
function optsHtml(){
  return wiz.options.map(function(o,i){
    return '<div class="opt-row"><button class="del" title="删除" onclick="wiz.options.splice('+i+',1);render()">✕</button>'
      +'<div style="display:grid;grid-template-columns:1fr 2fr 80px;gap:8px">'
      +'<input type="text" placeholder="选项名" value="'+esc(o.name)+'" oninput="wiz.options['+i+'].name=this.value">'
      +'<input type="text" placeholder="预期结果" value="'+esc(o.expected)+'" oninput="wiz.options['+i+'].expected=this.value">'
      +'<input type="number" placeholder="概率%" min="0" max="100" value="'+esc(o.prob)+'" oninput="wiz.options['+i+'].prob=this.value"></div></div>';}).join('');
}
function wizNext(){
  var w=wiz;
  if(w.step===1 && !w.situation.trim()){ toast('先把事情倒出来——哪怕是碎片。'); return; }
  if(w.step===3 && !w.domain){ toast('请选择领域。'); return; }
  if(w.step===4){
    if(w.dtype==='decision'){
      var named=w.options.filter(function(o){return o.name.trim()});
      if(named.length<2){ toast('至少写 2 个有名字的选项。没有备选就不叫决策。'); return; }
    }
    if(!w.falsifier.trim()){ toast('可证伪承诺是必填项：什么证据出现，说明你错了？'); return; }
  }
  w.step++; render();
}
function saveWizard(){
  var w=wiz;
  if(!w.falsifier.trim()){ toast('可证伪承诺必填。'); return; }
  var options;
  if(w.dtype==='prediction'){
    options=[{name:'预测成真',expected:w.prediction,prob:w.confidence},
             {name:'预测落空',expected:'—',prob:100-w.confidence}];
  } else {
    options=w.options.filter(function(o){return o.name.trim()}).map(function(o){
      return {name:o.name,expected:o.expected,prob:+o.prob||null};});
  }
  var d={id:uid(),createdAt:new Date().toISOString(),mode:'guided',status:'active',
    dtype:w.dtype,domain:w.domain,situation:w.situation,detail:w.detail||'',
    emotions:w.emotions,body:w.body,state:w.state,options:options,
    chosen:w.dtype==='prediction'?'预测成真':(w.chosen!==''?w.chosen:null),
    intuition:w.intuition,analysis:w.analysis,confidence:w.confidence,
    falsifier:w.falsifier,reviewInDays:w.reviewInDays,reviews:[]};
  S.decisions.unshift(d); S.usage.guided++;
  if(w.quickId){
    var qi=S.decisions.findIndex(function(x){return x.id===w.quickId});
    if(qi>=0){ S.decisions.splice(qi,1); S.usage.quickDone++; }
  }
  save(); var nid=d.id; wiz=null; capMode=null; tab='home'; render(); toast('🔒 已锁定保存');
  setTimeout(function(){ dqPrompt(nid); },600);
}
/* 保存后立刻问：现在做质量自检，还是以后再说。事前做才有意义。 */
function dqPrompt(id){
  var el=document.getElementById('modal-root'); if(!el) return;
  el.innerHTML='<div class="modal-mask" onclick="if(event.target===this)closeModal()">'
    +'<div class="modal" style="max-width:430px;padding:22px;text-align:center">'
    +'<div style="font-size:30px">📐</div><h2 style="margin:6px 0">趁热做 30 秒质量自检？</h2>'
    +'<p style="margin:4px 0 16px;font-size:13px;color:var(--t2)">六要素自检会直接告诉你<b>最弱环节</b>在哪一环。'
    +'<b style="color:var(--red)">现在做还来得及改决定</b>——等决定落地之后再做，就只是自我评分了。</p>'
    +'<div style="display:flex;gap:10px">'
    +'<button class="btn ok" style="flex:1" onclick="closeModal();openDQ(\''+id+'\')">现在做</button>'
    +'<button class="btn ghost" style="flex:1" onclick="closeModal()">先不了</button></div></div></div>';
}

/* ---------- AI 对话 ---------- */
var chat={msgs:[],busy:false};
/* 通用 AI 调用：OpenAI 兼容端点 → 解析 ```json``` 代码块 → 回调对象 */
function aiPost(messages,cb,err){
  fetch(S.settings.aiEndpoint,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.settings.aiKey},
    body:JSON.stringify({model:S.settings.aiModel,messages:messages,temperature:0.7})})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    var c=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
    if(!c) throw new Error('响应格式异常');
    var m=String(c).match(/```json\s*([\s\S]*?)```/)||String(c).match(/```\s*([\s\S]*?)```/);
    var j=null; if(m){ try{ j=JSON.parse(m[1]); }catch(e){} }
    if(!j) throw new Error('AI 未输出可解析的 JSON');
    cb(j);
  })
  .catch(function(e){ if(err) err(e); });
}
var AI_SYSTEM='你是"决策蒸馏"App的引导教练。你唯一的任务：通过对话帮助用户把一个正在面对的决策或判断记录下来。\n\n【纪律——违反即失败】\n1. 只提问、复述、澄清，绝不给建议，不评价用户的选择，不替用户做决定。\n2. 一次只问一个问题，每句尽量短。用户跑题就温和拉回。\n3. 用户说不清时用具体化追问："你说的X具体指什么？""能不能举个具体例子？"\n4. 语气平和克制，像苏格拉底式教练，不共情过度不鸡汤。\n\n【五阶段流程】\n阶段一·倒出来：问"你现在面对什么事情？想怎么处理？"让用户自由倾倒，不打断不评判。\n阶段二·标注情绪：问"此刻情绪和身体上有什么感觉？"逐个确认情绪词和强度(0-10)。\n阶段三·具体化：用5W澄清（谁/何时/约束/风险），确认这是"决策"还是"预测"。\n阶段四·选项与预期：让用户列出至少2个选项及各自预期结果与主观概率；问直觉答案和慢分析；问置信度(0-100)；必问"如果这个判断错了，最先出现的证据是什么？"\n阶段五·确认与承诺：复述结构化摘要请用户确认，问希望几天后复盘（3/7/14/30/90/180/365）。\n\n【输出格式】五阶段全部完成后，输出一段总结，然后输出一个JSON代码块（用三个反引号包住，标注json），字段如下：\n{"situation":"情境概述","domain":"职业发展|投资理财|人际关系|健康生活|消费购买|学习成长|其他","dtype":"decision或prediction","emotions":[{"name":"情绪词","intensity":0-10}],"body":"身体感受","options":[{"name":"选项名","expected":"预期结果","prob":0-100}],"chosen":"用户倾向的选项名","rationale":"用户的主要理由","intuition":"10秒直觉答案","analysis":"慢分析结论","confidence":0-100,"falsifier":"可证伪承诺","reviewInDays":30}\n如果信息缺失，字段填空字符串或空数组，不要编造。';
function initChat(){ chat={msgs:[{role:'assistant',content:'你好。我是你的决策记录教练——我只提问，不给建议，决定永远是你自己做。\n\n你现在面对什么事情？想怎么处理？随便说，说不清楚也没关系，说清楚是我的工作。'}],busy:false}; }
function viewChat(){
  var aiOn=!!(S.settings.aiEndpoint&&S.settings.aiKey&&S.settings.aiModel);
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    +'<h2 style="margin:0">🤖 AI 引导对话 · 五阶段协议</h2>'
    +'<div><button class="btn ghost sm" onclick="capMode=null;render()">← 返回</button> '
    +(aiOn?'<button class="btn ghost sm" onclick="initChat();render()">重开对话</button>':'')+'</div></div>';
  if(!aiOn){
    h+='<div class="alert amber"><div><b>未配置 AI</b><div class="tiny">设置页可接入任意 OpenAI 兼容端点（如 api.openai.com 或本地 Ollama http://localhost:11434/v1/chat/completions，隐私零外泄）。'
      +'未配置时推荐使用功能等价的引导向导。</div></div><button class="btn sm" onclick="go(\'settings\')">去配置</button></div></div>';
    return h;
  }
  h+='<div class="chat-box" id="chat-box">'+chat.msgs.map(function(m){
      return '<div class="msg '+(m.role==='assistant'?'ai':'me')+'">'+esc(m.content)+'</div>';}).join('')+'</div>'
    +'<div class="chat-input"><textarea id="chat-in" placeholder="想到什么说什么…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>'
    +'<button class="btn" id="chat-send" onclick="sendChat()" '+(chat.busy?'disabled':'')+'>'+(chat.busy?'…':'发送')+'</button></div>'
    +'<p class="tiny" style="margin-top:8px">AI 只追问不建议 · 数据流向：仅你配置的端点 · 对话完成后自动生成结构化草稿</p></div>';
  return h;
}
function sendChat(){
  var el=document.getElementById('chat-in'); var t=el.value.trim(); if(!t||chat.busy) return;
  el.value=''; chat.msgs.push({role:'user',content:t}); chat.busy=true; renderChatOnly();
  var msgs=[{role:'system',content:AI_SYSTEM}].concat(chat.msgs);
  fetch(S.settings.aiEndpoint,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.settings.aiKey},
    body:JSON.stringify({model:S.settings.aiModel,messages:msgs,temperature:0.6})})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status+' — 检查端点/密钥/模型名'); return r.json(); })
  .then(function(data){
    var c=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
    if(!c) throw new Error('响应格式异常');
    chat.msgs.push({role:'assistant',content:c}); chat.busy=false;
    S.usage.ai++; save(); renderChatOnly();
    var m=c.match(/```json\s*([\s\S]*?)```/);
    if(m){ try{ var j=JSON.parse(m[1]); chatDraft=j; renderChatOnly(); }catch(e){} }
  })
  .catch(function(e){
    chat.msgs.push({role:'assistant',content:'⚠️ 调用失败：'+e.message+'\n请到设置页检查配置。也可以先用引导向导完成这次记录。'});
    chat.busy=false; renderChatOnly();
  });
}
var chatDraft=null;
function renderChatOnly(){
  if(tab!=='capture'||capMode!=='ai'){ return; }
  render();
  var box=document.getElementById('chat-box'); if(box) box.scrollTop=box.scrollHeight;
  if(chatDraft){
    var d=chatDraft;

function arcExtract(){
  if(arc.busy) return;
  if(!String(arc.text||'').trim()||arc.text.trim().length<50){ toast('材料太短——至少粘贴 50 字。'); return; }
  arc.busy=true; render();
  var sys='你是"决策蒸馏"App的决策考古助手。用户粘贴一段过去的历史材料（日记/聊天记录/备忘录），你从中识别出用户本人做过的、且结果已知的决策或判断，输出结构化数据。\n'
    +'要求：\n1. 只收"用户做了选择或判断，且后来发生了可判定结果"的事件。还在进行中的、纯情绪抒发、别人的决定都不算。\n2. 结果写不出来的条目直接丢弃，宁缺毋滥。\n3. situation 用一两句概括当时的情境与用户的选择；outcome 用一两句写实际发生了什么；lesson 仅当材料里有明确反思时提取，否则留空。\n4. date 从材料推断，格式 YYYY-MM-DD，推断不出填 null。\n5. domain 只能从这些里选：职业发展/投资理财/人际关系/健康生活/消费购买/学习成长/其他。\n6. 最多 20 条，按时间正序。\n'
    +'输出格式：一个 json 代码块（三个反引号标注 json）：{"items":[{"date":"YYYY-MM-DD或null","situation":"...","domain":"...","outcome":"...","lesson":"..."}]}，没有合适的就 {"items":[]}。';
  aiPost([{role:'system',content:sys},{role:'user',content:arc.text.slice(0,20000)}],
    function(j){
      arc.busy=false;
      arc.items=(j.items||[]).filter(function(x){return x&&x.situation&&x.outcome}).slice(0,20);
      if(!arc.items.length){ arc.stage='input'; render();
        toast('没识别出"结果已知"的决策——试试粘贴包含事件经过和结果的段落。',4200); return; }
      arc.items.forEach(function(x){ x.ok=true; });
      arc.stage='review'; render();
    },
    function(e){
      arc.busy=false; render();
      toast('提取失败：'+(e&&e.message?e.message:'网络/配置问题')+'。检查设置页 AI 配置后重试。',4200);
    });
}
function arcImport(){
  var sel=arc.items.filter(function(x){return x.ok});
  if(!sel.length){ toast('至少勾选一条。'); return; }
  sel.forEach(function(x){
    var when=(x.date&&!isNaN(new Date(x.date).getTime()))?new Date(x.date).toISOString():new Date().toISOString();
    var d={id:uid(),createdAt:when,mode:'archaeo',source:'archaeo',status:'reviewed',dtype:'decision',
      domain:(DOMAINS.indexOf(x.domain)>=0?x.domain:'其他'),
      situation:x.situation,detail:'',emotions:[],body:'',state:{},
      options:[],chosen:null,intuition:'',analysis:'',rationale:'',
      confidence:null,falsifier:'',reviewInDays:null,
      reviews:[{date:when,outcome:x.outcome,expectedMatch:null,processScore:null,outcomeScore:null,
        usedIntuition:null,biases:[],lesson:x.lesson||'',pf:[]}]};
    S.decisions.unshift(d);
  });
  S.usage.arc=(S.usage.arc||0)+sel.length; save();
  arc={stage:'done',n:sel.length,text:''}; render();
  toast('🧱 已回溯建档 '+sel.length+' 条历史决策');

    +'<label>一句话教训</label><textarea id="rv-lesson" style="min-height:55px" oninput="rvTmp.lesson=this.value"></textarea>';

    h+='<label>这条决策检验了你的哪些原则？（诚实勾选——<b>违背率</b>才是一条原则的真实强度）</label>'

      var st=rvTmp.pf[p.id];

        +'<button class="pf-btn '+(st===1?'ok':'')+'" onclick="setPF(\''+p.id+'\',1)">'+(st===1?'✓ ':'')+'遵守</button>'

/* 候选原则：同领域优先，不足 5 条时补全部 */
function candPrinciples(d){
  if(!S.principles.length) return [];
  var same=S.principles.filter(function(p){return p.domain&&d.domain&&p.domain===d.domain});
  if(same.length>=5) return same;
  var rest=S.principles.filter(function(p){return same.indexOf(p)<0});
  return same.concat(rest).slice(0,6);
}
function setPF(pid,val){
  if(rvTmp.pf[pid]===val) delete rvTmp.pf[pid]; else rvTmp.pf[pid]=val;
  showReviewModal();
}
function sliderRv(k,v){
  return '<div class="slider-row"><input type="range" min="1" max="10" value="'+v+'" '
    +'oninput="rvTmp.'+k+'=+this.value;document.getElementById(\'rv-'+k+'\').textContent=this.value">'
    +'<span class="slider-val" id="rv-'+k+'">'+v+'</span></div>';
}
function toggleBias(b){
  var i=rvTmp.biases.indexOf(b);
  if(i>=0) rvTmp.biases.splice(i,1); else rvTmp.biases.push(b);
  var labels=document.getElementById('rv-biases').querySelectorAll('label');
  labels.forEach(function(l){ var t=l.textContent.replace(/^✓ /,'');
    l.className=rvTmp.biases.indexOf(t)>=0?'on':''; l.textContent=(rvTmp.biases.indexOf(t)>=0?'✓ ':'')+t; });
}
function saveReview(toPrinciple){
  if(!rvTmp.outcome.trim()){ toast('写下实际发生了什么——哪怕一句。'); return; }
  var d=S.decisions.find(function(x){return x.id===rvTmp.id});
  d.reviews=d.reviews||[];
  var pfArr=Object.keys(rvTmp.pf).map(function(pid){return {pid:pid,ok:rvTmp.pf[pid]}});
  d.reviews.push({date:new Date().toISOString(),outcome:rvTmp.outcome,expectedMatch:rvTmp.expectedMatch,
    processScore:rvTmp.processScore,outcomeScore:rvTmp.outcomeScore,usedIntuition:rvTmp.usedIntuition,
    biases:rvTmp.biases.slice(),lesson:rvTmp.lesson,pf:pfArr});
  d.status='reviewed'; S.usage.reviews++; save();
  closeModal(); render(); toast('✅ 复盘已保存');
  if(toPrinciple) openPrinciple(null,rvTmp.id,rvTmp.lesson);
}

/* 原则违背率统计 */
function pStats(p){
  var hit=0,miss=0;
  S.decisions.forEach(function(d){ (d.reviews||[]).forEach(function(r){
    (r.pf||[]).forEach(function(f){ if(f.pid===p.id){ if(f.ok) hit++; else miss++; } }); }); });
  var t=hit+miss;
  return {hit:hit,miss:miss,total:t,rate:t?miss/t:0};
}
/* 整体原则执行力 = 1 - 总违背率 */
function pfScore(){
  var hit=0,miss=0;
  S.decisions.forEach(function(d){ (d.reviews||[]).forEach(function(r){
    (r.pf||[]).forEach(function(f){ if(f.ok) hit++; else miss++; }); }); });
  var t=hit+miss;
  return t? {score:Math.round(hit/t*100),n:t} : null;
}

function savePrinciple(){
  if(!pTmp.ifText.trim()||!pTmp.thenText.trim()){ toast('IF 和 THEN 都要填写。'); return; }
  if(pTmp.id){
    var p=S.principles.find(function(x){return x.id===pTmp.id});
    if(!pTmp.changeReason.trim()){ toast('修改原则必须写变更理由——版本史是原则可信度的根基。'); return; }
    p.versions.push({v:p.versions.length+1,ifText:pTmp.ifText,thenText:pTmp.thenText,changeReason:pTmp.changeReason,at:new Date().toISOString()});
    p.ifText=pTmp.ifText;p.thenText=pTmp.thenText;p.rationale=pTmp.rationale;p.domain=pTmp.domain;
    toast('已保存为 v'+p.versions.length);

      domain:pTmp.domain,createdAt:new Date().toISOString(),cases:pTmp.caseId?[pTmp.caseId]:[],versions:[]});

var rp=null;
function startReplay(){
  var pool=S.decisions.filter(function(d){return d.reviews&&d.reviews.length&&d.options&&d.options.length>=2});
  if(!pool.length){ toast('盲测回放需要至少 1 条已复盘、含 2 个以上选项的决策。先去记录和复盘。'); return; }
  var d=pool[Math.floor(Math.random()*pool.length)];

  trainMode='replay'; render();

function replayHtml(){

function fcStat(pid,easy){

function calHtml(){
  var rs=[]; S.decisions.forEach(function(d){

  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    +'<h2 style="margin:0">📊 校准曲线</h2><button class="btn ghost sm" onclick="trainMode=null;render()">退出</button></div>';
  if(rs.length<5){

      +'每个置信度区间约需 30 个样本才有统计意义——在那之前，把它当"方向性自我觉察"而非结论。</p></div>';

  }
  var buckets=[[50,59],[60,69],[70,79],[80,89],[90,100]];
  h+='<p class="muted" style="margin-bottom:12px">样本 '+rs.length+' 条 · 每桶标注样本量（<10 时仅供参考）</p>';
  buckets.forEach(function(b){
    var grp=rs.filter(function(r){return r.conf>=b[0]&&r.conf<=b[1]});
    if(!grp.length){ h+='<div class="bar-wrap"><div class="bar-line"><span style="width:52px">'+b[0]+'-'+b[1]+'%</span><div class="bar"><i style="width:0"></i></div><span class="tiny" style="width:120px">无样本</span></div></div>'; return; }
    var hit=Math.round(100*grp.filter(function(r){return r.hit}).length/grp.length);
    var avg=Math.round(grp.reduce(function(a,r){return a+r.conf},0)/grp.length);
    var note=(grp.length<10?' <span class="tag amber">n='+grp.length+' 不足</span>':' n='+grp.length);
    h+='<div class="bar-wrap"><div class="bar-line"><span style="width:52px">'+b[0]+'-'+b[1]+'%</span>'
      +'<div class="bar"><i style="width:'+hit+'%;background:'+(hit>=avg-10?'var(--green)':'var(--red)')+'"></i></div>'
      +'<span style="width:150px" class="tiny">自报均值 '+avg+'% / 实际命中 '+hit+'%'+note+'</span></div></div>';
  });
  h+='<div class="why">💡 绿条=校准良好区间（命中≈自报），红条=偏差。系统性高估自己（命中<自报）通常出现在你情绪化或熟悉的领域。</div></div>';
  return h;
}

function submitAssess(){
  var raw={crt:[],num:[],frm:[],sunk:[],cal:[]}, missed=0;
  ASSESS_ITEMS.forEach(function(it,i){
    var a=assessAns[i];
    if(it.kind==='num'){ if(a==null||a===''){missed++;return;} raw[it.t].push(Math.abs(a-it.ans)<0.006?1:0); }
    else if(it.kind==='bool'){
      if(a.yn==null){missed++;return;}
      var p=(a.yn==='y'?a.conf:100-a.conf);
      raw.cal.push(Math.pow((p-(it.ans?100:0))/100,2));   /* 平方误差 = Brier 口径 */
    }
    else if(it.t==='frm'){ if(a==null){missed++;return;} raw.frm.push(a); }
    else { if(a==null){missed++;return;} raw[it.t].push(a===it.ans?1:0); }
  });
  if(missed>0){ toast('还有 '+missed+' 题没填，请补完再生成画像。'); return; }
  var mean=function(a){ return a.length? a.reduce(function(x,y){return x+y},0)/a.length : 0; };
  /* 框架免疫 = 两次同构问题的选择不被表述方式改变（Tversky & Kahneman 1981）。
     两次都选确定项（A+C）或两次都选风险项（B+D）都算免疫——风险取向本身无对错。 */
  var av=raw.frm[0], cv=raw.frm[1];
  var frmConsistent = raw.frm.length>=2 && av===cv;
  var scores={
    crt: Math.round(100*mean(raw.crt)),
    num: Math.round(100*mean(raw.num)),
    frm: frmConsistent?100:0,
    sunk: Math.round(100*mean(raw.sunk)),
    cal: Math.round(Math.max(0,100-200*mean(raw.cal)))
  };
  var keys=['crt','num','frm','sunk','cal'];
  var total=Math.round(keys.reduce(function(a,k){return a+scores[k]},0)/keys.length);
  S.assess={date:new Date().toISOString(),scores:scores,total:total,
    orientation:(av===0?'规避风险':'偏好冒险'),all:raw};
  S.assessHist.push({date:S.assess.date,total:total,scores:scores});
  if(S.assessHist.length>10) S.assessHist.shift();
  S.usage.assess=(S.usage.assess||0)+1; save();
  trainMode='assessResult'; render(); toast('✅ 画像已生成');
}

    +'<button class="btn sm" onclick="trainMode=\'fcst\';render()">开始预测训练 →</button></div></div>';
  return h;
}
function radarSvg(vals,labels){
  var cx=100,cy=102,R=68,n=vals.length,pts=[],axes='',rings='',lab='';
  for(var i=0;i<n;i++){
    var ang=-Math.PI/2+i*2*Math.PI/n;
    var r=R*Math.max(6,vals[i])/100;
    pts.push((cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1));
    var lx=cx+(R+16)*Math.cos(ang), ly=cy+(R+14)*Math.sin(ang);
    lab+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5f6470">'+esc(labels[i])+'</text>';
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(ang)).toFixed(1)+'" y2="'+(cy+R*Math.sin(ang)).toFixed(1)+'" stroke="#e3e5e8" stroke-width="0.6"/>';
  }
  [25,50,75,100].forEach(function(lv){
    var p=[]; for(var i=0;i<n;i++){ var a=-Math.PI/2+i*2*Math.PI/n, r=R*lv/100; p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }
    rings+='<polygon points="'+p.join(' ')+'" fill="none" stroke="#e3e5e8" stroke-width="0.6"/>';
  });
  return '<svg viewBox="0 0 200 200" style="width:100%;max-width:240px;flex:0 0 auto">'+rings+axes
    +'<polygon points="'+pts.join(' ')+'" fill="rgba(24,95,165,.15)" stroke="#185fa5" stroke-width="1.3"/>'+lab+'</svg>';
}

/* ================= 预测训练（Brier / 校准 · 代理轨） ================= */
var FC_TEMPLATES=[
 '本周我能在 23:00 前睡觉的天数 ≥4 天吗',
 '本周我会主动联系 ≥2 个新机会吗',
 '这次投递/提案能在 7 天内收到对方回复吗',
 '本月我的支出会超过预算吗',
 '这次 30 分钟的运动计划我能完成 ≥3 次吗',
 '下周的会议能在预定时间内结束吗',
 '我承诺的这件事会在承诺日期前完成吗',
 '这周我会有 ≥1 天完全不看手机超过 3 小时吗'
];
var fNew={p:60};
function addForecast(){
  var q=document.getElementById('fq-q').value.trim();
  if(!q){ toast('先写一句可判定的问题。'); return; }
  var days=+document.getElementById('fq-days').value;
  S.forecasts.unshift({id:uid(),q:q,p:fNew.p,due:new Date(Date.now()+days*86400000).toISOString(),
    createdAt:new Date().toISOString(),outcome:null});
  S.usage.forecasts=(S.usage.forecasts||0)+1; save(); render(); toast('已加入题集');
}
function fillForecast(t){ var el=document.getElementById('fq-q'); if(el) el.value=t; }
function resolveForecast(id,outcome){
  var f=S.forecasts.find(function(x){return x.id===id}); if(!f) return;
  f.outcome=outcome; f.resolvedAt=new Date().toISOString(); save(); render();
  toast('Brier 得分 '+((( f.p/100)-outcome)*(( f.p/100)-outcome)).toFixed(3)+'（越小越好）');
}
function delForecast(id){ S.forecasts=S.forecasts.filter(function(f){return f.id!==id}); save(); render(); }
function fcStats(){
  var done=S.forecasts.filter(function(f){return f.outcome!==null});
  if(!done.length) return null;
  var brier=0,absErr=0;
  done.forEach(function(f){ var e=(f.p/100)-f.outcome; brier+=e*e; absErr+=Math.abs(e); });
  var n=done.length;
  /* 校准桶：p<50 的预测换算成"反面事件 + 100-p"，否则低概率预测者整条曲线隐身 */
  var cal=done.map(function(f){ var p=f.p,o=f.outcome; if(p<50){ p=100-p; o=1-o; } return {p:p,o:o}; });
  var buckets=[[50,59],[60,69],[70,79],[80,89],[90,100]].map(function(b){
    var g=cal.filter(function(f){return f.p>=b[0]&&f.p<=b[1]});
    return {lo:b[0],hi:b[1],n:g.length,hit:g.length?Math.round(100*g.filter(function(f){return f.o===1}).length/g.length):null,
      avg:g.length?Math.round(g.reduce(function(a,f){return a+f.p},0)/g.length):null};
  });
  return {n:n,open:S.forecasts.filter(function(f){return f.outcome===null}).length,
    brier:brier/n,cal:Math.max(0,Math.round(100-200*(absErr/n))),buckets:buckets};
}
function forecastHtml(){
  var st=fcStats();
  var open=S.forecasts.filter(function(f){return f.outcome===null}).sort(function(a,b){return a.due<b.due?-1:1});
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
    +'<h2 style="margin:0">🎯 预测训练 · 代理轨</h2><button class="btn ghost sm" onclick="trainMode=null;render()">退出</button></div>'
    +'<div class="why">💡 这是<b>训练燃料，不是你的真实战绩</b>。每天 1 题，30 天就有 30 个样本——真实决策一年才 30 条。'
    +'题源可以是外部公开题（Good Judgment Open / Metaculus 的短周期问题），也可以是你自己的日常（下面有模板）。</div>';
  h+='<label>新问题（写成可判定的二选一）</label><input type="text" id="fq-q" placeholder="例如：本周我能在 23:00 前睡觉的天数 ≥4 天吗">'
    +'<label>你判断它发生的概率（%）</label><div class="slider-row">'
    +'<input type="range" min="5" max="95" value="'+fNew.p+'" oninput="fNew.p=+this.value;document.getElementById(\'fq-v\').textContent=this.value+\'%\'">'
    +'<span class="slider-val" id="fq-v">'+fNew.p+'%</span></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><select id="fq-days" style="width:auto">'
    +[3,7,14,30,60].map(function(n){return '<option value="'+n+'">'+n+' 天后揭晓</option>'}).join('')+'</select>'
    +'<button class="btn sm" onclick="addForecast()">加入题集</button></div>'
    +'<p class="tiny" style="margin-top:8px">点模板直接填入：'
    +'<span class="checks" style="margin-top:4px">'+FC_TEMPLATES.map(function(t){
      return '<label onclick="fillForecast(\''+t.replace(/'/g,"\\'")+'\')">'+esc(trunc(t,22))+'</label>';}).join('')+'</span></p>';
  if(open.length){
    h+='<h3 style="margin-top:14px">待揭晓（'+open.length+'）</h3>';
    open.forEach(function(f){
      var left=Math.ceil((new Date(f.due).getTime()-Date.now())/86400000);
      h+='<div class="opt-row"><div style="flex:1"><b style="font-size:13px">'+esc(f.q)+'</b>'
        +'<div class="tiny">你判断 <b>'+f.p+'%</b> · '+(left<=0?'可揭晓':'还剩 '+left+' 天')+'</div></div>'
        +'<button class="btn ghost sm" onclick="delForecast(\''+f.id+'\')">删</button></div>'
        +(left<=0?'<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn sm ok" onclick="resolveForecast(\''+f.id+'\',1)">发生了</button>'
          +'<button class="btn sm" onclick="resolveForecast(\''+f.id+'\',0)">没发生</button></div>':'');
    });
  }
  if(st){
    h+='<h3 style="margin-top:14px">我的预测战绩（代理轨 · '+st.n+' 条已揭晓）</h3>'
      +'<div class="grid g2" style="margin-bottom:10px">'
      +stat(st.brier.toFixed(3),'Brier 分数（0=完美，0.25=抛硬币）')
      +stat(st.cal,'校准分（100=完全校准）')+'</div>';
    st.buckets.forEach(function(b){
      if(!b.n){ h+='<div class="bar-wrap"><div class="bar-line"><span style="width:52px">'+b.lo+'-'+b.hi+'%</span><div class="bar"><i style="width:0"></i></div><span class="tiny">无样本</span></div></div>'; return; }
      h+='<div class="bar-wrap"><div class="bar-line"><span style="width:52px">'+b.lo+'-'+b.hi+'%</span>'
        +'<div class="bar"><i style="width:'+b.hit+'%;background:'+(b.hit>=b.avg-10?'var(--green)':'var(--red)')+'"></i></div>'
        +'<span class="tiny">自报 '+b.avg+'% / 实际 '+b.hit+'%'+(b.n<10?' <span class="tag amber">n='+b.n+'</span>':' n='+b.n)+'</span></div></div>';
    });
    h+='<div class="why" style="margin-top:10px">💡 Brier 分数参考：&lt;0.10 优秀 · 0.10~0.20 良好 · 0.25 ≈ 抛硬币 · &gt;0.30 说明概率表达需要重练。'
      +'这条曲线用的是<b>代理题</b>，与决策库里的真实校准曲线分开看。</div>';
  } else {
    h+='<p class="muted" style="margin-top:12px">还没有已揭晓的预测。加 5 题，3~7 天后回来看第一张校准曲线。</p>';
  }
  return h+'</div>';
}

var sjtSt=null;
/* 每题随机打乱选项顺序——防止"正确答案总在第三项"被刷题者记住 */
function sjtShuffle(n){ var a=[]; for(var i=0;i<n;i++)a.push(i);
  for(var j=n-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var t=a[j]; a[j]=a[k]; a[k]=t; } return a; }
function startSJT(){ sjtSt={i:0,logs:[],show:false,conf:70,pick:null,res:null,perm:sjtShuffle(SJT_DECK[0].opts.length)}; trainMode='sjt'; render(); }

function sjtSubmit(){

  sjtSt.logs.push({i:sjtSt.i,ok:orig===it.best,conf:sjtSt.conf,at:new Date().toISOString()});

function sjtNext(){

      res:{n:logs.length,good:good,avg:avg}};
    render(); return;
  }
  sjtSt.i++; sjtSt.show=false; sjtSt.pick=null; sjtSt.conf=70;
  sjtSt.perm=sjtShuffle(SJT_DECK[sjtSt.i].opts.length); render();

/* ================= 决策质量六要素自检（SDG · 链式规则） ================= */
/* 依据：Spetzler / Winter / Meyer《决策质量》（2016），源自 Ronald Howard 决策分析学派。
   链式规则：整体决策质量 = 最弱环节，不是平均值。 */
var DQ_KEYS=[
  {k:'frame', n:'问题框定', q:'我问的问题，是真正需要回答的那个吗？（还是被别人/情绪替我框定了？）'},
  {k:'alts',  n:'备选方案', q:'我有真正不同的选项吗？还是只在"做/不做"之间打转？'},
  {k:'info',  n:'信息质量', q:'我依据的信息可靠吗？还是道听途说、单一来源、或者我自己想听的？'},
  {k:'values',n:'价值权衡', q:'我清楚自己要什么、愿意拿什么换吗？'},

var dqTmp=null;
function dqScore(d){ if(!d.dq) return null;
  return Math.min.apply(null,DQ_KEYS.map(function(x){return d.dq[x.k]})); }
function dqWeakest(d){ if(!d.dq) return null;
  var worst=DQ_KEYS[0];
  DQ_KEYS.forEach(function(x){ if(d.dq[x.k]<d.dq[worst.k]) worst=x; });
  return worst; }
function dqAvg(){ var a=S.decisions.filter(function(d){return d.dq}).map(dqScore);
  return a.length? a.reduce(function(s,v){return s+v},0)/a.length : null; }
function openDQ(id){
  var d=S.decisions.find(function(x){return x.id===id}); if(!d) return;

    +'<b>链式规则：整体质量 = 最弱的一环，不是平均分</b>——所以别只顾着给擅长的那项打高分。</div>'
    +'<p class="tiny" style="color:var(--t3);margin-bottom:10px">针对：'+esc(trunc(d.situation,40))+'</p>';

      +'<div class="tiny" style="color:var(--t3);margin:2px 0 4px">'+x.q+'</div>'
      +'<input type="range" min="0" max="100" value="'+dqTmp.v[x.k]+'" style="width:100%" '
      +'oninput="dqTmp.v.'+x.k+'=+this.value;document.getElementById(\'dq-'+x.k+'\').textContent=this.value;dqLive()"></div>';
  });
  h+='<div id="dq-live" class="why" style="background:var(--purple-l);border-color:#ddd0f0">拉一下滑块，这里会实时告诉你最弱环节。</div>'
    +'<div style="margin-top:14px;display:flex;gap:8px">'
    +'<button class="btn ok" onclick="saveDQ()">保存自检</button>'
    +'<button class="btn ghost" onclick="closeModal()">取消</button></div></div></div>';

}
function dqLive(){
  var vals=DQ_KEYS.map(function(x){return dqTmp.v[x.k]});
  var mn=Math.min.apply(null,vals);
  var worst=DQ_KEYS[vals.indexOf(mn)];

  el.innerHTML='<b>DQ 分 '+mn+' / 100</b>（链式规则 = 最弱环节：'+worst.n+'）　'+lv
    +'<br><span style="color:var(--t3)">平均分 '+(Math.round(vals.reduce(function(a,b){return a+b},0)/6))+' —— 但平均分没有意义，别看它。</span>';

function saveDQ(){
  var d=S.decisions.find(function(x){return x.id===dqTmp.id});

function boardStats(){
  var m={};
  S.decisions.forEach(function(d){ (d.boards||[]).forEach(function(b){
    (b.items||[]).forEach(function(it){
      if(!m[it.v]) m[it.v]={n:0,adopted:0,useful:0};
      m[it.v].n++;
      if(it.mark==='adopted') m[it.v].adopted++;
      if(it.mark==='useful') m[it.v].useful++;
    });});});
  return m;
}
function boardTotals(){
  var m=boardStats(), t={n:0,adopted:0};
  Object.keys(m).forEach(function(k){ t.n+=m[k].n; t.adopted+=m[k].adopted; });
  return t.n? {n:t.n, rate:Math.round(100*t.adopted/t.n)} : null;
}

  L.push('> 不是从我的文字语料里提炼的。区别在于：语料里那个"我"是我希望被看到的我，这里的"我"是被现实修正过的我。');
  L.push('');
  L.push('## 0. 这份文件不是什么（重要）');
  L.push('');
  L.push('- 它不是我的人格，是我的**决策数据的投影**');
  L.push('- 它没有我的情绪、没有当下的情境信息、不知道我现在手里有什么牌');
  L.push('- 它只能做三件事：报出我的原则、提醒我的校准画像、指出我常犯的偏差');
  L.push('- **它永远不能替我做决定**——只能提问');
  L.push('');
  L.push('## 1. 数据可信度（先看这个，再往下看）');
  L.push('');
  L.push('| 指标 | 值 | 样本量 |');
  L.push('|---|---|---|');
  L.push('| 决策记录 | '+n+' 条 | — |');
  L.push('| 已复盘 | '+rv+' 条 | — |');
  L.push('| 判断准确度（Brier） | '+(fc?fc.brier.toFixed(3):'—')+' | '+(fc?fc.n:0)+' 条已揭晓预测 |');
  L.push('| 过程质量（DQ，取最弱环节） | '+(dqA!=null?Math.round(dqA):'—')+' | '+S.decisions.filter(function(d){return d.dq}).length+' 条已自检 |');
  L.push('| 原则执行力（1 − 违背率） | '+(pf?pf.score+'%':'—')+' | '+(pf?pf.n:0)+' 次原则检验 |');
  L.push('| 外部视角采纳率 | '+(bt?bt.rate+'%':'—')+' | '+(bt?bt.n:0)+' 条会诊追问 |');
  L.push('');
  L.push('⚠️ **样本量小于 30 时，下面所有结论都只是方向性自我觉察，不是统计结论。**');
  L.push('');
  L.push('## 2. 我的原则（按检验次数排序）');
  L.push('');
  if(!ps.length){ L.push('_还没有原则。这个系统要求先诚实记录，同类情境出现 3 次以上才提炼原则——太早蒸馏出来的只是噪音。_'); }
  else {
    if(solid.length){
      L.push('### 有执行记录支撑的');
      L.push('');
      solid.forEach(function(x){
        var rate = x.st.total? '检验 '+x.st.total+' 次 · 违背 '+Math.round(x.st.rate*100)+'%' : '尚未被检验';
        L.push('- **IF** '+x.p.ifText);
        L.push('  **THEN** '+x.p.thenText);
        L.push('  — '+x.p.domain+' · '+rate+((x.p.rationale&&!sanitize)?' · 依据：'+x.p.rationale:''));
      });
      L.push('');
    }
    if(wish.length){
      L.push('### 违背率过半：这些是愿望，不是原则');
      L.push('');
      L.push('_以下原则被检验 5 次以上且违背率 ≥50%。它们记录的是"我想成为的人"，不是"现在的我"。要么改写成做得到的，要么承认它不是原则。_');
      L.push('');

  L.push('## 3. 我在哪些领域可信（校准画像）');
  L.push('');
  if(!Object.keys(ds).length){ L.push('_还没有领域数据。_'); }
  else {
    L.push('| 领域 | 记录数 | 平均过程分 | 结论 |');
    L.push('|---|---|---|---|');
    Object.keys(ds).forEach(function(k){
      var x=ds[k], avg=x.pN?(x.pSum/x.pN).toFixed(1):null;
      var c = avg==null?'待复盘出分' : (avg>=7?'直觉在此领域较可信' : avg>=5?'需慢想 + 找反对意见' : '**直觉在此领域不可信，必须慢想**');

  L.push('');

  L.push('3. 如果我给的置信度 <70%，提醒我把它当假设，不要当事实。');
  L.push('4. 如果我正处在高情绪状态，提醒我：**高情绪下不做不可逆决定**。');
  L.push('5. 如果我的推理里出现了第 4 节列出的偏差，直接指出来。');
  L.push('6. 如果现实的反馈和这份文件冲突，**以现实为准，并提醒我回来更新这份文件**。');
  L.push('');
  L.push('---');
  L.push('');
  L.push('_生成时间：'+fmtFull(new Date().toISOString())+' · 数据源：'+n+' 条决策 / '+rv+' 条复盘 / '+S.principles.length+' 条原则_');
  if(sanitize){
    L.push('_本文件为脱敏版：已剔除原则"依据"原文（那里可能含情境细节），仅保留 IF/THEN、统计与画像。');

  }

  var md=L.join('\n');
  var blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='my-decision-skill-'+fmtFull(new Date().toISOString())+(sanitize?'':'（未脱敏）')+'.md';
  a.click();

function testAI(){

  fetch(S.settings.aiEndpoint,{method:'POST',

/* ---------- 复盘日历（.ics）：导入系统日历后，App 不开着也会到点提醒 ---------- */
function escIcs(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;')
    .replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsDate(ts){ var d=new Date(ts); return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function pad2(n){ return (n<10?'0':'')+n; }
function buildIcs(events,fname){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Decision Distiller//CN','CALSCALE:GREGORIAN'];
  events.forEach(function(ev){
    L.push('BEGIN:VEVENT');
    L.push('UID:'+ev.uid);
    L.push('DTSTAMP:'+icsDate(Date.now())+'T000000Z');
    L.push('DTSTART;VALUE=DATE:'+icsDate(ev.start));
    L.push('DTEND;VALUE=DATE:'+icsDate(ev.start+86400000));
    L.push('SUMMARY:'+escIcs(ev.title));
    L.push('DESCRIPTION:'+escIcs(ev.desc));
    L.push('BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:明天有一次决策复盘','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  var blob=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
}
function icsAll(){
  var evs=S.decisions.filter(function(d){return d.status==='active' && d.reviewInDays!=null})
    .map(function(d){
      return { uid:'dd-review-'+d.id+'@decision-distiller',
        start:new Date(d.createdAt).getTime()+d.reviewInDays*86400000,
        title:'⏰ 复盘决策：'+trunc(d.situation,20),
        desc:'记录于 '+fmtFull(d.createdAt)+' · 领域：'+(d.domain||'—')
          +(d.falsifier?' · 可证伪承诺：'+trunc(d.falsifier,60):'')
          +' · 来自「决策蒸馏」App（重复导入日历会产生重复事件，新增决策后请重新导出）' };
    });
  if(!evs.length){ toast('没有"进行中且设了复盘日"的决策可导出。'); return; }
  buildIcs(evs,'决策蒸馏-复盘日历.ics');
  toast('📅 已导出 '+evs.length+' 条复盘提醒——导入手机/电脑日历后自动提醒');
}
function icsOne(id){
  var d=S.decisions.find(function(x){return x.id===id}); if(!d) return;
  if(d.reviewInDays==null){ toast('这条记录没有设复盘日。'); return; }
  buildIcs([{uid:'dd-review-'+d.id+'@decision-distiller',
    start:new Date(d.createdAt).getTime()+d.reviewInDays*86400000,
    title:'⏰ 复盘决策：'+trunc(d.situation,20),
    desc:'记录于 '+fmtFull(d.createdAt)+(d.falsifier?' · 可证伪承诺：'+trunc(d.falsifier,60):'')+' · 来自「决策蒸馏」'}],
    '复盘-'+fmtFull(d.createdAt)+'.ics');
  toast('📅 已导出这条复盘的日历事件');
}
function importData(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ try{
    var d=JSON.parse(r.result);
    if(!d.decisions||!d.principles) throw new Error('格式不对');
    confirmBox('导入将覆盖当前全部数据（当前 '+S.decisions.length+' 条决策）。继续？',function(){
      var localKey=S.settings?S.settings.aiKey:'';   /* 备份文件不含密钥，保留本机已配置的 */
      S=migrate(d);
      if(!S.settings.aiKey) S.settings.aiKey=localKey;
      save(); render(); toast('✅ 导入成功：'+S.decisions.length+' 条决策，'+S.principles.length+' 条原则');
    });
  }catch(e){ toast('导入失败：'+e.message); } };
  r.readAsText(f);
}
function resetAll(){
  confirmBox('⚠️ 将清空全部决策、原则、训练记录，不可恢复。确定？',function(){
    confirmBox('再次确认：真的要全部清空？建议先导出备份。',function(){
      localStorage.removeItem(LS_KEY); idbClear(); S=load(); save(); render(); toast('已清空');
    });
  });
}

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){

render();
/* 请求持久存储（Chrome/Edge：防浏览器压力清理；无害于不支持的浏览器） */
try{ if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().then(function(){}); } }catch(e){}
/* localStorage 被清/损坏时，从 IndexedDB 镜像找回 */
idbRescue();
